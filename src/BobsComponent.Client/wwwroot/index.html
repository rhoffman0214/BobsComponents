<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>BobsComponents</title>
        <base href="/" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <!-- Global CSS -->
        <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
        <link href="css/jc-reset.css" rel="stylesheet" />
        <link href="css/themes.css" rel="stylesheet" />
        <link href="css/app.css" rel="stylesheet" />

        <!-- BobsComponents (prefixed, layered CSS) -->
        <link href="_content/BobsComponents/bob.css" rel="stylesheet" />
        <link href="_content/BobsComponents.Docs/bob-docs.css" rel="stylesheet" />

        <!-- Library Component CSS -->
        <link href="_content/BobsComponent.Library/css/micro-actions.css" rel="stylesheet" />

        <!-- Scoped CSS automatically injected by Blazor -->
        <link href="BobsComponent.Client.styles.css" rel="stylesheet" />
        <!-- Keep the BobsComponents theme in step with the site theme, so the demos look right when the site is light but the OS is dark (or the reverse). -->
        <script>
            (function () {
                function luminance(c) {
                    var m = c.match(/\d+(\.\d+)?/g);
                    if (!m) return 1;
                    var v = m.slice(0, 3).map(function (n) { n = n / 255; return n <= 0.03928 ? n / 12.92 : Math.pow((n + 0.055) / 1.055, 2.4); });
                    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
                }
                function sync() {
                    var root = document.documentElement;
                    var bg = getComputedStyle(root).getPropertyValue('--bg-primary').trim();
                    if (!bg) return;
                    var probe = document.createElement('span');
                    probe.style.color = bg;
                    document.body.appendChild(probe);
                    var lum = luminance(getComputedStyle(probe).color);
                    probe.remove();
                    root.setAttribute('data-bob-theme', lum < 0.4 ? 'dark' : 'light');
                }
                new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
                document.addEventListener('DOMContentLoaded', sync);
                window.addEventListener('load', sync);
            })();
        </script>
    </head>

    <body>

        <div id="app">
            Loading...
        </div>

        <script>
            // GitHub Pages SPA redirect handling
            (function() {
                var redirect = sessionStorage.redirect;
                delete sessionStorage.redirect;
                if (redirect && redirect !== location.href) {
                    history.replaceState(null, null, redirect);
                }
            })();
        </script>

        <!-- Console Error Monitor for Deployment Testing -->
        <script src="js/console-monitor.js"></script>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>
        <script src="_content/BobsComponent.Library/theme.js"></script>
        <script src="_content/BobsComponent.Library/js/table-of-contents.js"></script>
        <script src="_content/BobsComponent.Library/js/nav-menu.js"></script>
        <script src="_framework/blazor.webassembly.js"></script>
    </body>
</html>
